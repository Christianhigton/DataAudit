---
name: dataAudit
title: Data Audit and Codebook
jrs: '1.1'
items:
  - name: moduleRefs
    title: References
    type: Html

  - name: summary
    title: Plain-English Summary
    type: Html
    visible: (includeSummary)
    refs:
      - dataaudit
      - tabachnick_fidell

  - name: auditScore
    title: Traffic-Light Audit Score
    type: Table
    visible: (includeAuditScore)
    clearWith:
      - vars
      - highMissing
      - moderateMissing
      - zThreshold
      - iqrMultiplier
      - includeAssumptions
    columns:
      - { name: domain, title: Domain, type: text }
      - { name: status, title: Status, type: text }
      - { name: evidence, title: Evidence, type: text }
      - { name: recommendedAction, title: Recommended action, type: text }

  - name: screeningChecklist
    title: Data-Screening Checklist
    type: Table
    visible: (includeChecklist)
    clearWith:
      - vars
      - screeningDesign
      - includeAssumptions
      - group
      - predictors
    columns:
      - { name: step, title: Step, type: text }
      - { name: status, title: Status, type: text }
      - { name: check, title: What was checked, type: text }
      - { name: nextAction, title: Next action, type: text }

  - name: overview
    title: Dataset Overview
    type: Table
    visible: (includeOverview)
    refs:
      - dataaudit
      - tabachnick_fidell
    clearWith:
      - vars
      - moderateMissing
      - highMissing
    columns:
      - { name: metric, title: Metric, type: text }
      - { name: value, title: Value, type: text }

  - name: dictionary
    title: Variable Dictionary / Codebook (Compact)
    type: Table
    visible: (includeDictionary)
    clearWith:
      - vars
      - moderateMissing
      - highMissing
    columns:
      - { name: variable, title: Variable name, type: text }
      - { name: label, title: Variable label, type: text }
      - { name: inferred, title: Inferred variable type, type: text }
      - { name: missing, title: Missing, type: integer }
      - { name: missingPct, title: Missing %, type: number }
      - { name: unique, title: Unique valid values, type: integer }
      - { name: recommendedAction, title: Recommended action, type: text }

  - name: exportCodebook
    title: Exportable Codebook
    type: Table
    visible: (includeExportCodebook)
    clearWith:
      - vars
      - moderateMissing
      - highMissing
    columns:
      - { name: variable, title: Variable, type: text }
      - { name: label, title: Label, type: text }
      - { name: type, title: Type, type: text }
      - { name: measure, title: Measurement level, type: text }
      - { name: missing, title: Missing, type: integer }
      - { name: missingPct, title: Missing %, type: number }
      - { name: validRangeCategories, title: Valid range/categories, type: text }
      - { name: warnings, title: Warnings, type: text }
      - { name: recommendedAction, title: Recommended action, type: text }

  - name: missingByVariable
    title: Missing Data by Variable
    type: Table
    visible: (includeMissing)
    clearWith:
      - vars
      - moderateMissing
      - highMissing
    columns:
      - { name: variable, title: Variable, type: text }
      - { name: valid, title: Valid n, type: integer }
      - { name: missing, title: Missing n, type: integer }
      - { name: missingPct, title: Missing %, type: number }
      - { name: flag, title: Missingness flag, type: text }
      - { name: recommendation, title: Recommendation, type: text }

  - name: missingByCase
    title: Cases with Missing Data
    type: Table
    visible: (includeMissing)
    clearWith:
      - vars
      - caseID
      - maxCaseRows
    columns:
      - { name: case, title: Row number or case ID, type: text }
      - { name: missing, title: Number of missing variables, type: integer }
      - { name: missingPct, title: Percentage missing, type: number }
      - { name: flag, title: Flag, type: text }

  - name: missingText
    title: Missing Data Interpretation
    type: Html
    visible: (includeMissing)

  - name: missingPatterns
    title: Missing-Data Patterns
    type: Table
    visible: (includeMissing)
    clearWith:
      - vars
      - maxCaseRows
    columns:
      - { name: pattern, title: Missing variables pattern, type: text }
      - { name: n, title: Cases, type: integer }
      - { name: percent, title: Percent of rows, type: number }
      - { name: rows, title: Example row numbers, type: text }

  - name: quality
    title: Data-Quality Flags
    type: Table
    visible: (includeQuality)
    clearWith:
      - vars
      - highMissing
      - smallCategoryN
    columns:
      - { name: variable, title: Variable, type: text }
      - { name: issue, title: Issue type, type: text }
      - { name: details, title: Details, type: text }
      - { name: severity, title: Severity, type: text }
      - { name: action, title: Suggested action, type: text }

  - name: rangeRuleFlags
    title: Out-of-Range Rule Flags
    type: Table
    visible: (includeRangeRules)
    clearWith:
      - vars
      - rangeRules
      - caseID
    columns:
      - { name: variable, title: Variable, type: text }
      - { name: validRange, title: Valid range / allowed values, type: text }
      - { name: observedRange, title: Observed range in data, type: text }
      - { name: rows, title: Row numbers / case IDs, type: text }
      - { name: outOfRangeValues, title: Out-of-range values found, type: text }
      - { name: n, title: Flagged n, type: integer }
      - { name: action, title: Recommended action, type: text }

  - name: duplicateReview
    title: Duplicate Case Review
    type: Table
    visible: (includeDuplicateReview)
    clearWith:
      - vars
      - caseID
    columns:
      - { name: issue, title: Issue, type: text }
      - { name: rows, title: Row numbers / case IDs, type: text }
      - { name: n, title: Count, type: integer }
      - { name: details, title: Details, type: text }
      - { name: action, title: Recommended action, type: text }

  - name: surveyResponseFlags
    title: Survey Response Pattern Flags
    type: Table
    visible: (includeSurveyChecks)
    clearWith:
      - vars
      - caseID
    columns:
      - { name: row, title: Row number / case ID, type: text }
      - { name: issue, title: Issue, type: text }
      - { name: variables, title: Variables checked, type: text }
      - { name: details, title: Details, type: text }
      - { name: action, title: Recommended action, type: text }

  - name: attentionCheckFlags
    title: Attention Check Flags
    type: Table
    visible: (includeAttentionChecks)
    clearWith:
      - vars
      - caseID
    columns:
      - { name: row, title: Row number / case ID, type: text }
      - { name: issue, title: Attention-check issue, type: text }
      - { name: variables, title: Variables checked, type: text }
      - { name: details, title: Details, type: text }
      - { name: action, title: Recommended action, type: text }

  - name: metadataSuggestions
    title: jamovi Metadata Repair Suggestions
    type: Table
    visible: (includeQuality)
    clearWith:
      - vars
    columns:
      - { name: variable, title: Variable, type: text }
      - { name: currentMeasure, title: Current measurement level, type: text }
      - { name: inferredType, title: Inferred type, type: text }
      - { name: suggestion, title: Suggested repair, type: text }
      - { name: reason, title: Reason, type: text }

  - name: descriptives
    title: Descriptives for Continuous and Integer Variables
    type: Table
    visible: (includeDescriptives)
    clearWith:
      - vars
    columns:
      - { name: variable, title: Variable, type: text }
      - { name: n, title: n, type: integer }
      - { name: missing, title: Missing n, type: integer }
      - { name: mean, title: Mean, type: number }
      - { name: sd, title: SD, type: number }
      - { name: median, title: Median, type: number }
      - { name: min, title: Minimum, type: number }
      - { name: max, title: Maximum, type: number }
      - { name: skewness, title: Skewness, type: number }
      - { name: kurtosis, title: Kurtosis, type: number }

  - name: frequencies
    title: Frequencies for Categorical Variables
    type: Table
    visible: (includeFrequencies)
    clearWith:
      - vars
    columns:
      - { name: variable, title: Variable, type: text }
      - { name: category, title: Category, type: text }
      - { name: n, title: n, type: integer }
      - { name: validPct, title: Valid %, type: number }
      - { name: totalPct, title: Total %, type: number }

  - name: missingPlot
    title: Missing Data Plot
    type: Image
    visible: (includeGraphs)
    clearWith:
      - vars
      - graphMaxVars
    width: 650
    height: 420
    renderFun: .missingPlot

  - name: numericPlot
    title: Numeric Histograms
    type: Image
    visible: (includeGraphs)
    clearWith:
      - vars
      - graphMaxVars
      - includeNormalCurveHistograms
    width: 720
    height: 560
    renderFun: .numericPlot

  - name: violinPlot
    title: Numeric Violin Plots
    type: Image
    visible: (includeGraphs && includeViolinPlots)
    clearWith:
      - vars
      - graphMaxVars
    width: 720
    height: 560
    renderFun: .violinPlot

  - name: boxPlot
    title: Numeric Boxplots
    type: Image
    visible: (includeGraphs)
    clearWith:
      - vars
      - graphMaxVars
    width: 720
    height: 560
    renderFun: .boxPlot

  - name: categoricalPlot
    title: Categorical Distributions
    type: Image
    visible: (includeGraphs)
    clearWith:
      - vars
      - graphMaxVars
      - graphTopCategories
    width: 720
    height: 560
    renderFun: .categoricalPlot

  - name: surveyPlot
    title: Survey Raincloud Plots
    type: Image
    visible: (includeGraphs && includeSurveyPlots)
    clearWith:
      - vars
      - graphMaxVars
    width: 760
    height: 560
    renderFun: .surveyPlot

  - name: correlationPlot
    title: Correlation Heatmap
    type: Image
    visible: (includeGraphs)
    clearWith:
      - vars
      - graphMaxVars
    width: 650
    height: 560
    renderFun: .correlationPlot

  - name: normality
    title: Normality Screening
    type: Table
    visible: (includeAssumptions && normalityChecks)
    clearWith:
      - vars
      - skewThreshold
      - kurtosisThreshold
    columns:
      - { name: variable, title: Variable, type: text }
      - { name: n, title: n, type: integer }
      - { name: mean, title: Mean, type: number }
      - { name: sd, title: SD, type: number }
      - { name: median, title: Median, type: number }
      - { name: skewness, title: Skewness, type: number }
      - { name: kurtosis, title: Kurtosis, type: number }
      - { name: w, title: Shapiro-Wilk W, type: number }
      - name: p
        title: Shapiro-Wilk p
        type: number
        format: zto,pvalue
      - { name: flag, title: Normality flag, type: text }

  - name: normalityNote
    title: Normality Note
    type: Html
    visible: (includeAssumptions && normalityChecks)

  - name: outliers
    title: Outlier Screening
    type: Table
    visible: (includeAssumptions && outlierChecks)
    clearWith:
      - vars
      - zThreshold
      - iqrMultiplier
      - caseID
    columns:
      - { name: variable, title: Variable, type: text }
      - { name: zOutliers, title: z-score outliers, type: integer }
      - { name: iqrOutliers, title: IQR outliers, type: integer }
      - { name: low, title: Most extreme low value, type: number }
      - { name: high, title: Most extreme high value, type: number }
      - { name: cases, title: Potential outlier case IDs, type: text }
      - { name: flag, title: Flag, type: text }

  - name: homogeneity
    title: Homogeneity of Variance
    type: Table
    visible: (includeAssumptions && homogeneityChecks)
    clearWith:
      - vars
      - group
    columns:
      - { name: outcome, title: Outcome variable, type: text }
      - { name: group, title: Grouping variable, type: text }
      - { name: statistic, title: Levene statistic, type: number }
      - { name: df, title: df, type: text }
      - name: p
        title: p
        type: number
        format: zto,pvalue
      - { name: groupSDs, title: Group standard deviations, type: text }
      - { name: varRatio, title: Variance ratio, type: number }
      - { name: flag, title: Flag, type: text }

  - name: linearity
    title: Linearity Screening
    type: Table
    visible: (includeAssumptions && linearityChecks)
    clearWith:
      - outcome
      - predictors
    columns:
      - { name: outcome, title: Outcome, type: text }
      - { name: predictor, title: Predictor, type: text }
      - { name: pearson, title: Pearson correlation, type: number }
      - { name: spearman, title: Spearman correlation, type: number }
      - { name: n, title: Pairwise n, type: integer }
      - { name: flag, title: Flag, type: text }

  - name: vif
    title: Multicollinearity Screening
    type: Table
    visible: (includeAssumptions && multicollinearityChecks)
    clearWith:
      - predictors
      - vifWarning
      - vifSerious
    columns:
      - { name: predictor, title: Predictor, type: text }
      - { name: vif, title: VIF, type: number }
      - { name: tolerance, title: Tolerance, type: number }
      - { name: flag, title: Flag, type: text }
...
